[project]
name = "avinox-ridedata-server"
version = "0.8.0"
description = "Fahrdaten vom DJI-Avinox-Display auslesen, auswerten und bereitstellen"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.5",
    "fastapi>=0.162.5",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "joserfc>=1.8.0",
    "mcp>=2.3.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
avinox = "avinox.cli:main"

[dependency-groups]
dev = [
    "fitdecode>=0.11.0",
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avinox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
