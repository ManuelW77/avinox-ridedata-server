<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Avinox Ride Data{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="{{ url_for('static', path='icon-192.png') }}" alt=""> Avinox Ride Data</a>
    <nav>
      {% set p = request.url.path %}
      <a href="/" {% if p == '/' %}aria-current="page"{% endif %}>Übersicht</a>
      <a href="/rides" {% if p.startswith('/rides') %}aria-current="page"{% endif %}>Fahrten</a>
      <a href="/device" {% if p == '/device' %}aria-current="page"{% endif %}>Bike &amp; Akku</a>
      <a href="/settings" {% if p == '/settings' %}aria-current="page"{% endif %}>Einstellungen</a>
    </nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
