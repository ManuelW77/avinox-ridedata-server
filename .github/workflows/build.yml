name: build

on:
  push:
    branches: [main, devel]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q

  docker:
    needs: server-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image-Name in Kleinbuchstaben
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/avinox-ridedata-server" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: esp32/avinox-sync
    steps:
      - uses: actions/checkout@v5
      - name: Bauen
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3 build
      - name: Komplett-Image zusammenfügen
        run: |
          . "$IDF_PATH/export.sh"
          # Offsets liest idf.py selbst aus build/flasher_args.json
          idf.py merge-bin -o avinox-sync-full.bin
          ls -l build/avinox-sync.bin build/avinox-sync-full.bin
      - uses: actions/upload-artifact@v4
        with:
          name: avinox-sync-firmware
          path: |
            esp32/avinox-sync/build/avinox-sync.bin
            esp32/avinox-sync/build/avinox-sync-full.bin
            esp32/avinox-sync/build/flasher_args.json
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esp32/avinox-sync/build/avinox-sync.bin
            esp32/avinox-sync/build/avinox-sync-full.bin
            esp32/avinox-sync/build/flasher_args.json
          body: |
            Firmware für ESP32-S3 / firmware for ESP32-S3.

            - `avinox-sync-full.bin`: Erst-Flash / first flash: `esptool.py --chip esp32s3 write_flash 0x0 avinox-sync-full.bin`
            - `avinox-sync.bin`: Update per WLAN (OTA) über Server-Einstellungen / OTA update via server settings
            - Docker-Image: `ghcr.io/${{ github.repository_owner }}/avinox-ridedata-server`
