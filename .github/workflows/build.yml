name: build

on:
  push:
    branches: [main, devel]
    tags: ["server-v*", "fw-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-test:
    # Bei Firmware-Tags überspringen
    if: ${{ !startsWith(github.ref, 'refs/tags/fw-v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run pytest -q

  docker:
    needs: server-test
    # Nur bei einem Server-Release-Tag (bump-version.sh)
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image-Name in Kleinbuchstaben
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/avinox-ridedata-server" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=server-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=server-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          make_latest: false
          body: |
            Server-Release / server release.

            - Docker-Image: `ghcr.io/${{ github.repository_owner }}/avinox-ridedata-server:${{ steps.meta.outputs.version }}`
            - Die Firmware hat eigene Releases (`fw-v*`) / the firmware has its own releases (`fw-v*`).

  esp32:
    # Nur bei einem Firmware-Release-Tag (bump-version.sh)
    if: startsWith(github.ref, 'refs/tags/fw-v')
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: esp32/avinox-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bauen
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3 build
      - name: Komplett-Image zusammenfügen
        run: |
          . "$IDF_PATH/export.sh"
          # Offsets liest idf.py selbst aus build/flasher_args.json
          idf.py merge-bin -o avinox-sync-full.bin
          ls -l build/avinox-sync.bin build/avinox-sync-full.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avinox-sync-firmware
          path: |
            esp32/avinox-sync/build/avinox-sync.bin
            esp32/avinox-sync/build/avinox-sync-full.bin
            esp32/avinox-sync/build/flasher_args.json
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/fw-v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          make_latest: true
          files: |
            esp32/avinox-sync/build/avinox-sync.bin
            esp32/avinox-sync/build/avinox-sync-full.bin
            esp32/avinox-sync/build/flasher_args.json
          body: |
            Firmware für ESP32-S3 / firmware for ESP32-S3.

            - `avinox-sync-full.bin`: Erst-Flash / first flash: `esptool.py --chip esp32s3 write_flash 0x0 avinox-sync-full.bin`
            - `avinox-sync.bin`: Update per WLAN (OTA) über Server-Einstellungen / OTA update via server settings
