name: build

on:
  push:
    branches: [main, devel]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv run pytest -q

  docker:
    needs: server-test
    # Nur bei einem Release-Tag (scripts/release.sh)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Image-Name in Kleinbuchstaben
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/avinox-ridedata-server" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  esp32:
    needs: server-test
    # Nur bei einem Release-Tag (scripts/release.sh)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: esp32/avinox-sync
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Bauen
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3 build
      - name: Komplett-Image zusammenfügen
        run: |
          . "$IDF_PATH/export.sh"
          # Offsets liest idf.py selbst aus build/flasher_args.json
          idf.py merge-bin -o avinox-sync-full.bin
          ls -l build/avinox-sync.bin build/avinox-sync-full.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avinox-sync-firmware
          path: |
            esp32/avinox-sync/build/avinox-sync.bin
            esp32/avinox-sync/build/avinox-sync-full.bin
            esp32/avinox-sync/build/flasher_args.json
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            esp32/avinox-sync/build/avinox-sync.bin
            esp32/avinox-sync/build/avinox-sync-full.bin
            esp32/avinox-sync/build/flasher_args.json
          body: |
            Firmware für ESP32-S3 / firmware for ESP32-S3.

            - `avinox-sync-full.bin`: Erst-Flash / first flash: `esptool.py --chip esp32s3 write_flash 0x0 avinox-sync-full.bin`
            - `avinox-sync.bin`: Update per WLAN (OTA) über Server-Einstellungen / OTA update via server settings
            - Docker-Image: `ghcr.io/${{ github.repository_owner }}/avinox-ridedata-server`
