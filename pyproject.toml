[project]
name = "avinox-ridedata-server"
version = "0.1.0"
description = "Fahrdaten vom DJI-Avinox-Display auslesen, auswerten und bereitstellen"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
avinox = "avinox.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avinox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
